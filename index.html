<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Objetivo C1</title>
  <meta name="description" content="Seguimiento del plan de inglés C1 en 24 semanas">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Objetivo C1">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Objetivo C1</h1>
    <span id="header-week" class="muted"></span>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-action="tab" data-view="hoy">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Hoy
    </button>
    <button data-action="tab" data-view="semana">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>Semana
    </button>
    <button data-action="tab" data-view="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan
    </button>
    <button data-action="tab" data-view="materiales">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v4h4M8 13h8M8 17h5"/></svg>Materiales
    </button>
    <button data-action="tab" data-view="progreso">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg>Progreso
    </button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <dialog id="sheet" class="sheet">
    <div class="sheet-body"></div>
  </dialog>
</body>
</html>
